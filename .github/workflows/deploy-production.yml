name: Deploy Production

# El deploy a producción lo hace la integración Git de Vercel (proyecto "blog").
# Este workflow es opcional: solo manual, si tienes un VERCEL_TOKEN con acceso al team.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Vercel CLI
        # Fijar versión: vercel@latest a veces publica deps rotas (p. ej. @vercel/cervel 404).
        run: npm install --global vercel@59.16.0

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '%s\n' '{"orgId":"team_ED4JT637mALZVOb0g0fDFaMf","projectId":"prj_lPZqMR4NWy21nad4q5PzMXUAm5eA"}' > .vercel/project.json

      - name: Deploy to production
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: team_ED4JT637mALZVOb0g0fDFaMf
          VERCEL_PROJECT_ID: prj_lPZqMR4NWy21nad4q5PzMXUAm5eA
